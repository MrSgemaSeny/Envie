spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/envie}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:test_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pass1}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

management.endpoints.web.base-path=/api/v1/actuator

envie.upload-dir=${UPLOAD_DIR:./uploads}
envie.templates-dir=${TEMPLATES_DIR:../templates}
envie.anthropic-api-key=${ANTHROPIC_API_KEY:}
