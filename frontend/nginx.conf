server {
    listen 80;
    server_name localhost;

    # Nginx serves static files from /usr/share/nginx/html
    # Since Vite builds with base '/Envie/', the files are placed in /usr/share/nginx/html/Envie
    # We want requests to /Envie to hit the application
    location /Envie {
        alias /usr/share/nginx/html/Envie;
        index index.html;
        try_files $uri $uri/ /Envie/index.html;
    }

    # Redirect root to /Envie
    location = / {
        return 301 /Envie;
    }
}
